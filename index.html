<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sift — prépa sons DJ</title>
<link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
<!-- Le bandeau `#sift-gate` (racine de bibliothèque non définie) vivait ici, au-dessus de la
     charpente entière. Retiré le 2026-09-02 (issue #54) : la racine n'est plus un prérequis de la
     conversion — on convertit en place ou vers un dossier externe sans en avoir aucune — donc un
     bandeau permanent criait un prérequis qui ne mord qu'à une destination de l'arbre. Le rappel
     est descendu dans le rail, sous les sources (`rail-root-warning.ts`, direction A2). -->
<div class="pa" id="pa" tabindex="0">
  <div class="sb" id="nav">
    <!-- La marque (`.nav-brand`, logo + bouton de repli) a quitté le rail pour le segment gauche
         de la barre unifiée le 2026-09-03 (issue #56, demande d'Antoine) : convention Windows de
         l'icône d'app en titlebar, et le rail y gagne une rangée. Le markup vit dans
         `chrome.ts::injectTitlebar` — la démo navigateur (sans Tauri) n'a donc plus ni logo ni
         bouton de repli, ce qui est accepté : la maquette ne fait pas autorité. -->
    <!-- Rail en SECTIONS depuis 2026-08-19 (étape 4, DESIGN.md § 15). Huit entrées à plat ne
         disaient pas dans quel ordre on traverse l'app ; groupées, elles disent le parcours :
         on traite, puis on range, puis on exporte. Un seul niveau d'indentation, en-têtes en
         petites capitales discrètes (.nv-grp, qui existait dans la feuille SANS aucun
         consommateur depuis sa création — il en a un maintenant). -->
    <div class="nv-grp">Traiter</div>
    <div class="nv" tabindex="0" role="button" data-view="revue" title="Revue"><i class="ti ti-headphones" aria-hidden="true"></i><span>Revue</span></div>
    <div class="nv" tabindex="0" role="button" data-view="journal" title="Journal des actions"><i class="ti ti-history" aria-hidden="true"></i><span>Journal</span></div>
    <div class="nv-grp">Bibliothèque</div>
    <div class="nv" tabindex="0" role="button" data-view="biblio" title="Bibliothèque"><i class="ti ti-folders" aria-hidden="true"></i><span>Rangés</span></div>
    <div class="nv" tabindex="0" role="button" data-view="ecarts" title="Écartés / à re-sourcer"><i class="ti ti-alert-circle" aria-hidden="true"></i><span>Écartés</span></div>
    <div class="nv-grp">Exporter</div>
    <div class="nv" tabindex="0" role="button" data-view="rkb" title="Rekordbox"><i class="ti ti-disc" aria-hidden="true"></i><span>Rekordbox</span></div>
    <div class="nv" tabindex="0" role="button" data-view="cle" title="Formater une clé USB"><i class="ti ti-usb" aria-hidden="true"></i><span>Clé USB</span></div>
    <!-- Section Sources : remplie par rail-sources.ts depuis listSources(). Descendue en BAS du
         rail dans un CADRAN de dépôt le 2026-09-03 (issue #56, décision A « puits calme ») : cadre
         hairline permanent — patron HIG § Image wells, seul puits de dépôt permanent qu'Apple
         dessine — qui dit qu'on peut y déposer des dossiers. Le pointillé info reste réservé au
         drag (`.sift-dz-on`). Cliquer une source filtre Revue sur ses fichiers (fusion 1,
         DESIGN.md § 15). La classe `sift-rail-drop` porte le cadran (partagée avec la story). -->
    <div id="sift-rail-sources" class="sift-rail-drop"></div>
    <div class="nav-foot">
      <!-- Séparateur de Réglages en ÉLÉMENT dédié (demande d'Antoine, 2026-09-03) : porté par
           l'entrée (.nav-foot>.nv, border-top + padding-top), il gonflait sa boîte de 9px et son
           fond de survol montait jusqu'au trait — Réglages était la seule entrée du rail à la
           géométrie différente. La zone de progression se `prepend()` dans .nav-foot, donc elle
           passe AU-DESSUS de ce trait, Réglages toujours dessous (annotation du 2026-07-09). -->
      <div class="nav-sep" aria-hidden="true"></div>
      <div class="nv" tabindex="0" role="button" data-view="reglages" title="Réglages"><i class="ti ti-settings" aria-hidden="true"></i><span>Réglages</span></div>
    </div>
  </div>
  <!-- Titre de page accessible, invisible à l'œil, mis à jour par app.js::render(). Hors de
       #content exprès : les vues y réécrivent innerHTML et l'emporteraient. Voir .sift-sr-only. -->
  <h1 id="sift-view-title" class="sift-sr-only">Accueil</h1>
  <div id="content"></div>
  <!-- Zone D du shell (DESIGN.md § 14) : l'inspecteur. Sœur de #content et non enfant, pour la
       raison même qui le rend nécessaire — un détail rendu DANS la zone qui défile part hors
       écran dès qu'on ouvre une ligne loin dans la liste. Masqué tant qu'aucune vue ne le
       remplit ; une vue qui le remplit retire son [hidden]. -->
  <!-- Poignée de redimensionnement de la zone D (« il faut aussi pouvoir redimensionner le panneau »,
       Antoine, 2026-09-08) : la même que celle de la file de Revue (.sift-qresize, router.ts), posée
       sur le bord gauche de l'inspecteur. Suit son [hidden] — toolbar.ts openAside/closeAside. -->
  <div class="sift-qresize sift-aside-resize" id="sift-aside-resize" title="Redimensionner l'inspecteur" hidden></div>
  <div id="sift-aside" hidden></div>
</div>
<script type="module" src="/frontend/main.ts"></script>
</body>
</html>
